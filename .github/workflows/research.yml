name: tmp-dep-research
on: push
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          set +e
          {
          npm install --ignore-scripts --no-fund 2>&1 | tail -5
          echo "## audit all (new)"; npm audit --json | node -e 'const a=JSON.parse(require("fs").readFileSync(0));console.log(JSON.stringify(a.metadata.vulnerabilities));for(const [n,v] of Object.entries(a.vulnerabilities||{}))console.log(n,v.severity,v.isDirect?"direct":"",v.range,"fix:",JSON.stringify(v.fixAvailable),"via:",v.via.map(x=>typeof x==="string"?x:x.title).join(" | "))'
          echo "## versions"; for m in next react react-dom zod @vercel/blob undici postcss effect deepmerge-ts @prisma/client prisma vitest vite esbuild tsx @playwright/test; do echo "$m $(node -p "require('$m/package.json').version" 2>/dev/null)"; done
          echo "## npm ls postcss undici"; npm ls postcss undici effect deepmerge-ts 2>&1 | head -30
          for p in vitest@3 vitest@latest vite@6 vite@7 tsx@latest @playwright/test@latest; do echo "## $p"; npm view "$p" version | tail -1; done
          } > out.txt 2>&1
          cat out.txt
      - uses: actions/upload-artifact@v4
        with:
          name: out
          path: |
            out.txt
            package-lock.json
