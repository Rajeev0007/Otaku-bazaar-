# Builds a portable dependency bundle (node_modules + Prisma engines for Amazon Linux + an
# embedded Postgres) used by offline development sandboxes. Not needed for normal development.
name: deps-bundle
on:
  workflow_dispatch:
  push:
    paths: [package.json, .github/workflows/deps.yml]
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Prisma engines for rhel-openssl-3.0.x
        run: |
          H=$(node -p "require('@prisma/engines-version').enginesVersion")
          B=https://binaries.prisma.sh/all_commits/$H/rhel-openssl-3.0.x
          cd node_modules/@prisma/engines
          curl -fsSL $B/schema-engine.gz | gunzip > schema-engine-rhel-openssl-3.0.x && chmod +x schema-engine-rhel-openssl-3.0.x
          curl -fsSL $B/libquery_engine.so.node.gz | gunzip > libquery_engine-rhel-openssl-3.0.x.so.node
          ls -la
      - name: Embedded Postgres
        run: |
          mkdir -p pgtools && cd pgtools && npm init -y >/dev/null
          V=$(npm view @embedded-postgres/linux-x64 versions --json | node -e "const v=JSON.parse(require('fs').readFileSync(0));console.log(v.filter(x=>x.startsWith('17.')).pop())")
          echo "embedded-postgres $V"
          npm install --no-audit --no-fund @embedded-postgres/linux-x64@$V
          ls node_modules/@embedded-postgres/linux-x64/native/bin | head -30
          ls node_modules/@embedded-postgres/linux-x64/native/share/postgresql/extension | grep -i trgm || true
      - name: Headless Chromium for Playwright
        run: |
          PLAYWRIGHT_BROWSERS_PATH=$PWD/pw-browsers npx playwright install chromium-headless-shell
          ls pw-browsers
      - run: tar czf nm.tgz node_modules package-lock.json pgtools pw-browsers
      - uses: actions/upload-artifact@v4
        with:
          name: deps
          path: nm.tgz
          retention-days: 7
