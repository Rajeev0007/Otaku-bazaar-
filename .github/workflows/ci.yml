name: ci
on: [push]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: tar czf nm.tgz node_modules package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: deps
          path: nm.tgz
