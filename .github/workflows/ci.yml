name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/otaku_e2e
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/otaku_test
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/otaku_shadow
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      APP_URL: http://localhost:3100
      SEED_DEMO_ACCOUNTS: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

      - name: Migrations match the schema
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE otaku_shadow"
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code

      - name: Unit & integration tests
        run: |
          DATABASE_URL=$TEST_DATABASE_URL npx prisma migrate deploy
          npm test

      - name: Seed demo store and build
        run: |
          npx prisma migrate deploy
          npm run db:seed
          npm run build

      - name: End-to-end tests (desktop + mobile)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: test-results
          retention-days: 7
